function pick(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

function generateReview() {
  let text;
  let mode = Math.random();

  // 模式1: 三段式（开头+中间+结尾）- 40%
  if (mode < 0.4) {
    text = pick(starters) + pick(middles) + pick(endings);
  }
  // 模式2: 双段式 - 25%
  else if (mode < 0.65) {
    if (Math.random() < 0.5) {
      text = pick(starters) + pick(endings);
    } else {
      text = pick(starters) + pick(middles);
    }
  }
  // 模式3: 完整长评 - 35%
  else {
    text = pick(longReviews);
  }

  document.getElementById('reviewText').textContent = text;
}

function copyReview() {
  const text = document.getElementById('reviewText').textContent;
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => {
      const btn = document.querySelector('.btn-copy');
      btn.textContent = '✅ 已复制';
      setTimeout(() => { btn.textContent = '📋 复制'; }, 1500);
    });
  } else {
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    alert('已复制到剪贴板');
  }
}

// 首次加载自动生成
generateReview();
